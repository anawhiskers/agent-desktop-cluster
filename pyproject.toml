[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diy-agent-stack"
version = "0.1.0"
description = "Owner-run MCP and SSH tools for a small Linux desktop fleet"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==1.23.3"]
desktop = ["Pillow==12.3.0"]

[project.scripts]
diy-stack = "diy_agent_stack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diy_agent_stack = ["web/*"]
